<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File a Complaint | LuponResolve</title>

  <style>
    :root {
      --primary: #1e3a8a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 1.1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    nav a {
      margin-left: 1.5rem;
      text-decoration: none;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--primary);
    }

    main {
      flex: 1;
      max-width: 760px;
      margin: 3.5rem auto 4rem;
      padding: 0 1.5rem;
      width: 100%;
    }

    .page-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .page-header h1 {
      font-size: 2.25rem;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .page-header p {
      color: var(--muted);
      font-size: 1.05rem;
    }

    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.04);
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
      margin: 1.75rem 0 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .section-title:first-of-type {
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    input[type="text"],
    input[type="tel"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      background: #ffffff;
      color: var(--text);
      transition: border-color 0.2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 640px) {
      .grid-2 { grid-template-columns: 1fr; }
      .form-card { padding: 1.5rem; }
    }

    .consent-card {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 1.2rem;
      margin: 1.75rem 0;
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
    }

    .consent-card input {
      margin-top: 0.25rem;
      cursor: pointer;
    }

    .consent-card label {
      font-size: 0.85rem;
      color: #1e3a8a;
      font-weight: 500;
      line-height: 1.5;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 0.9rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: var(--accent-hover);
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      background: var(--card-bg);
      margin-top: auto;
    }
  </style>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <a href="index.html" class="brand">⚖️ LuponResolve</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="portal.html">Official Portal</a>
    </nav>
  </header>

  <main>
    <div class="page-header">
      <h1>File a Dispute Complaint</h1>
      <p>Katarungang Pambarangay Incident Intake Form</p>
    </div>

    <div class="form-card">
      <form id="complaintForm">
        
        <div class="section-title">1. Complainant Information (Nangreklamo)</div>
        <div class="form-group">
          <label for="complainantName">Full Name</label>
          <input type="text" id="complainantName" placeholder="e.g., Juan Dela Cruz" required />
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label for="complainantContact">Contact Number</label>
            <input type="tel" id="complainantContact" placeholder="09xxxxxxxxx" required />
          </div>
          <div class="form-group">
            <label for="complainantPurok">Purok / Sitio</label>
            <input type="text" id="complainantPurok" placeholder="e.g., Purok 3" required />
          </div>
        </div>

        <div class="section-title">2. Respondent Information (Gireklamo)</div>
        <div class="form-group">
          <label for="respondentName">Full Name</label>
          <input type="text" id="respondentName" placeholder="Full name of person being reported" required />
        </div>
        <div class="form-group">
          <label for="respondentPurok">Known Purok / Address</label>
          <input type="text" id="respondentPurok" placeholder="Purok or exact location" required />
        </div>

        <div class="section-title">3. Nature of Complaint</div>
        <div class="grid-2">
          <div class="form-group">
            <label for="disputeType">Dispute Type</label>
            <select id="disputeType" required>
              <option value="" disabled selected>Select category</option>
              <option value="boundary">Boundary / Land Dispute</option>
              <option value="debt">Unpaid Debt / Financial Obligation</option>
              <option value="altercation">Physical / Verbal Altercation</option>
              <option value="disturbance">Public Disturbance / Noise</option>
              <option value="other">Other Civil Dispute</option>
            </select>
          </div>
          <div class="form-group">
            <label for="incidentDate">Date of Incident</label>
            <input type="date" id="incidentDate" required />
          </div>
        </div>

        <div class="form-group">
          <label for="incidentNarrative">Statement of Facts / Summary</label>
          <textarea id="incidentNarrative" rows="4" placeholder="Briefly describe what happened..." required></textarea>
        </div>

        <div class="consent-card">
          <input type="checkbox" id="privacyConsent" required />
          <label for="privacyConsent">
            I confirm that the information provided is accurate and grant consent to process this data strictly for Katarungang Pambarangay conciliation proceedings pursuant to RA 10173 (Data Privacy Act).
          </label>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Submit Complaint</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 LuponResolve. Compliant with RA 7160 & RA 10173 (Data Privacy Act).</p>
  </footer>

  <script>
    const supabaseUrl = https://ivphxduuzemdmkjdgeqy.supabase.co;
    const supabaseKey = sb_publishable_Eh44ol3xJHhoxPNOS6Tueg_SzHFTi5u; 
    const db = window.supabase.createClient(supabaseUrl, supabaseKey);

    document.getElementById('complaintForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Submitting to database...';

      const trackingNo = 'KP-' + new Date().getFullYear() + '-' + Math.floor(1000 + Math.random() * 9000);

      const payload = {
        docket: trackingNo,
        complainant: document.getElementById('complainantName').value,
        complainant_purok: document.getElementById('complainantPurok').value,
        respondent: document.getElementById('respondentName').value,
        respondent_purok: document.getElementById('respondentPurok').value,
        dispute_type: document.getElementById('disputeType').value,
        incident_date: document.getElementById('incidentDate').value,
        narrative: document.getElementById('incidentNarrative').value,
        status: 'Under Review',
        hearing_date: null
      };

      const { data, error } = await db.from('cases').insert([payload]);

      if (error) {
        alert('Failed to submit: ' + error.message);
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit Complaint';
      } else {
        alert('Complaint recorded successfully!\n\nTracking Docket Number: ' + trackingNo);
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
